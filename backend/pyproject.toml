[project]
name = "memeshare-backend"
version = "0.1.0"
description = "MemeShare FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
# Production stack: Postgres + S3 + a real WSGI/ASGI server
prod = [
    "asyncpg>=0.29",
    "boto3>=1.34",
    "gunicorn>=22.0",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "greenlet>=3.0",
    "httpx>=0.27",
    "httpx-ws>=0.6",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/File()/Form() defaults are the intended idiom.
# UP042: str+Enum mixin is deliberate (JSON-serialisable values).
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# async ORM code runs in greenlets; count those lines too
concurrency = ["thread", "greenlet"]
omit = ["app/storage/s3.py"]  # prod-only, exercised in the prod env

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
