# Render Blueprint — backend + database on Render's free tier.
# Docs: https://render.com/docs/blueprint-spec
#
#   memeshare-db   -> free PostgreSQL 16   (Render deletes free DBs after 30 days)
#   memeshare-api  -> free FastAPI web service
#
# The frontend deploys to Vercel — see DEPLOY.md.
#
# FREE-TIER LIMITS TO KNOW:
#  * No persistent disk -> uploaded media (STORAGE_BACKEND=local) is LOST on every
#    deploy / restart / daily recycle: the Postgres rows survive but the image
#    files do not, so old posts/avatars 404. Move media to object storage:
#      1. Create a bucket + API token (Cloudflare R2 free tier: 10 GB, no egress).
#      2. In the Render dashboard fill in the S3_* vars below (they are sync:false).
#      3. Set STORAGE_BACKEND=s3 and redeploy.
#    URLs are rebuilt from config at response time, so no data migration is needed;
#    images uploaded while on `local` still need re-uploading.
#  * The web service sleeps after ~15 min idle; first request then takes ~1 min and
#    all live WebSocket chats drop. Fine for testing.
#  * Always a single instance -> matches the in-process WebSocket registry.

databases:
  - name: memeshare-db
    plan: free
    databaseName: memeshare
    user: memeshare
    region: oregon
    postgresMajorVersion: "16"

services:
  # ---------- Backend API + WebSockets ----------
  - type: web
    name: memeshare-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    autoDeploy: true
    buildCommand: "pip install -e '.[prod]'"
    # Free tier has no preDeployCommand, so migrate right before starting the server.
    # Retry for ~2 min: a just-provisioned free database can still be booting and
    # refuse connections (ECONNREFUSED on :5432) when the first attempt runs.
    startCommand: "n=0; until alembic upgrade head; do n=$((n+1)); if [ $n -ge 24 ]; then echo 'database unreachable after 2 min'; exit 1; fi; echo \"waiting for database ($n/24)...\"; sleep 5; done; exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true            # Render makes a strong value; check it's >= 32 chars
      - key: DATABASE_URL
        fromDatabase:
          name: memeshare-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local                   # ephemeral on free tier — set to "s3" once the S3_* vars are filled in
      - key: CORS_ORIGINS
        sync: false                    # set to the Vercel frontend URL after it deploys
      # ----- Object storage (fill these in the dashboard, then STORAGE_BACKEND=s3) -----
      - key: S3_ENDPOINT_URL
        sync: false                    # e.g. https://<accountid>.r2.cloudflarestorage.com  (omit for AWS S3)
      - key: S3_REGION
        value: auto                    # "auto" for R2; a real region (e.g. us-east-1) for AWS S3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false                    # public base for objects, e.g. https://media.<yourdomain> or the R2 public bucket URL
