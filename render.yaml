# Render Blueprint — backend + database on Render's free tier.
# Docs: https://render.com/docs/blueprint-spec
#
#   memeshare-db   -> free PostgreSQL 16   (Render deletes free DBs after 30 days)
#   memeshare-api  -> free FastAPI web service
#
# The frontend deploys to Vercel — see DEPLOY.md.
#
# FREE-TIER LIMITS TO KNOW:
#  * No persistent disk -> uploaded media (STORAGE_BACKEND=local) is LOST on every
#    deploy / restart / daily recycle. Swap to S3/R2 (see git history of this file)
#    before real users.
#  * The web service sleeps after ~15 min idle; first request then takes ~1 min and
#    all live WebSocket chats drop. Fine for testing.
#  * Always a single instance -> matches the in-process WebSocket registry.

databases:
  - name: memeshare-db
    plan: free
    databaseName: memeshare
    user: memeshare
    region: oregon
    postgresMajorVersion: "16"

services:
  # ---------- Backend API + WebSockets ----------
  - type: web
    name: memeshare-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    autoDeploy: true
    buildCommand: "pip install -e '.[prod]'"
    # Free tier has no preDeployCommand, so migrate right before starting the server.
    # Retry for ~2 min: a just-provisioned free database can still be booting and
    # refuse connections (ECONNREFUSED on :5432) when the first attempt runs.
    startCommand: "n=0; until alembic upgrade head; do n=$((n+1)); if [ $n -ge 24 ]; then echo 'database unreachable after 2 min'; exit 1; fi; echo \"waiting for database ($n/24)...\"; sleep 5; done; exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true            # Render makes a strong value; check it's >= 32 chars
      - key: DATABASE_URL
        fromDatabase:
          name: memeshare-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local                   # ephemeral on free tier — see note above
      - key: CORS_ORIGINS
        sync: false                    # set to the Vercel frontend URL after it deploys
