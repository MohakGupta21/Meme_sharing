# Render Blueprint — everything on Render, all free tier.
# Docs: https://render.com/docs/blueprint-spec
#
#   memeshare-db   -> free PostgreSQL 16   (Render deletes free DBs after 30 days)
#   memeshare-api  -> free FastAPI web service
#   memeshare-web  -> free static site (the React frontend)
#
# FREE-TIER LIMITS TO KNOW:
#  * No persistent disk -> uploaded media (STORAGE_BACKEND=local) is LOST on every
#    deploy / restart / daily recycle. Swap to S3/R2 (see git history of this file)
#    before real users.
#  * The web service sleeps after ~15 min idle; first request then takes ~1 min and
#    all live WebSocket chats drop. Fine for testing.
#  * Always a single instance -> matches the in-process WebSocket registry.

databases:
  - name: memeshare-db
    plan: free
    databaseName: memeshare
    user: memeshare
    region: oregon
    postgresMajorVersion: "16"

services:
  # ---------- Backend API + WebSockets ----------
  - type: web
    name: memeshare-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    autoDeploy: true
    buildCommand: "pip install -e '.[prod]'"
    # Free tier has no preDeployCommand, so migrate right before starting the server.
    startCommand: "alembic upgrade head && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true            # Render makes a strong value; check it's >= 32 chars
      - key: DATABASE_URL
        fromDatabase:
          name: memeshare-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local                   # ephemeral on free tier — see note above
      - key: CORS_ORIGINS
        sync: false                    # set to the memeshare-web URL after first deploy

  # ---------- Frontend (static React build) ----------
  - type: web
    name: memeshare-web
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html       # SPA fallback for React Router
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                    # https://<memeshare-api URL>/api/v1
      - key: VITE_WS_URL
        sync: false                    # wss://<memeshare-api URL>/ws/chat
