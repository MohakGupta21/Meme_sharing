# Render Blueprint — MemeShare backend + managed Postgres.
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend is NOT here — it deploys to Cloudflare Pages (see DEPLOY.md).
# Media is NOT on Render — it lives in Cloudflare R2 (STORAGE_BACKEND=s3 below).
#
# IMPORTANT: the WebSocket ConnectionManager is in-process, so this service must
# run as a SINGLE instance with a SINGLE worker (numInstances: 1, gunicorn -w 1).
# Do not enable autoscaling until a Redis pub/sub adapter is added.

databases:
  - name: memeshare-db
    plan: basic-256mb          # smallest paid tier; use `free` to trial (expires after 30 days)
    databaseName: memeshare
    user: memeshare
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: memeshare-api
    runtime: python
    plan: starter             # `free` works but sleeps on idle -> drops every live chat socket
    region: oregon            # keep in the same region as the database
    rootDir: backend
    numInstances: 1           # MUST stay 1 (in-process WebSocket registry)
    autoDeploy: true          # deploy on push to the default branch
    buildCommand: "pip install -e '.[prod]'"
    preDeployCommand: "alembic upgrade head"   # runs once per deploy, before traffic shifts
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health  # plain liveness check — no DB dependency
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SQL_ECHO
        value: "false"

      # Auth — Render generates a strong random value on first deploy.
      # Verify it is >= 32 chars in the dashboard; regenerate if not.
      - key: JWT_SECRET
        generateValue: true

      # Database — internal (same-region) connection string, no sslmode param.
      - key: DATABASE_URL
        fromDatabase:
          name: memeshare-db
          property: connectionString

      # CORS — set to the exact Cloudflare Pages origin AFTER that project exists,
      # e.g. https://memeshare.pages.dev  (no trailing slash, never "*").
      - key: CORS_ORIGINS
        sync: false

      # Object storage — Cloudflare R2 (S3-compatible). Fill these in the dashboard.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: memeshare-media
      - key: S3_REGION
        value: auto                       # R2 expects the literal "auto"
      - key: S3_ENDPOINT_URL
        sync: false                       # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        sync: false                       # R2 API token — Access Key ID
      - key: S3_SECRET_KEY
        sync: false                       # R2 API token — Secret Access Key
      - key: S3_PUBLIC_URL
        sync: false                       # public base URL for the bucket (custom domain recommended)

      # Upload ceilings — uncomment to override the code defaults (10MB img / 50MB vid / 64MB req)
      # - key: MAX_IMAGE_BYTES
      #   value: "10485760"
      # - key: MAX_VIDEO_BYTES
      #   value: "52428800"
      # - key: MAX_REQUEST_BYTES
      #   value: "67108864"
